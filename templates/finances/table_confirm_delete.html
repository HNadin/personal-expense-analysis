{% extends 'base.html' %}

{% block title %}Видалити таблицю — ExpenseTrack{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <a href="{% url 'table_list' %}" class="breadcrumb-link mb-3 d-inline-flex">
                <i class="bi bi-arrow-left"></i>
                До таблиць
            </a>
            <div class="delete-card">
                <div class="delete-card-icon">🗑️</div>
                <h4 class="text-center fw-bold mb-2" style="color:#991b1b;">Видалити таблицю?</h4>
                <p class="text-center text-muted mb-1">
                    <strong style="color:var(--text);">{{ object.name }}</strong>
                </p>
                <p class="text-center small mb-4" style="color:#991b1b;">
                    Усі транзакції в цій таблиці теж будуть видалені. Цю дію неможливо скасувати.
                </p>
                <form method="post" class="d-flex gap-2 justify-content-center">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i>
                        Так, видалити
                    </button>
                    <a href="{% url 'table_list' %}" class="btn btn-outline-secondary">Скасувати</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
