{% extends 'base.html' %}

{% block title %}Видалити транзакцію{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="alert alert-warning">
            <h4>Видалити транзакцію?</h4>
            <p><strong>{{ object.title|default:"Без назви" }}</strong> — {{ object.amount }} {{ object.currency }}</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Так, видалити</button>
            <a href="{% url 'transaction_list' table_id=object.table.pk %}" class="btn btn-outline-secondary">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
